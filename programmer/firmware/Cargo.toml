[package]
name         = "vectrex-programmer"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "RP2354B firmware for the Vectrex flash cartridge programmer"

[dependencies]
# Embassy: async executor, time driver, USB stack. Chosen over rp235x-hal because
# this firmware has to service USB, a cartridge bus and I2S audio concurrently,
# and because embassy-rp emits the RP2350 IMAGE_DEF block automatically.
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time     = { version = "0.5.1",  features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync     = { version = "0.8.0",  features = ["defmt"] }
embassy-futures  = "0.1.2"

# rp235xb = the 80-pin / 48-GPIO variant, which is what the RP2354B is.
# unstable-pac is needed for the raw SIO/QMI access in cart.rs and extflash.rs.
embassy-rp = { version = "0.10.0", features = [
    "rp235xb", "time-driver", "critical-section-impl", "binary-info",
    "unstable-pac", "defmt", "executor-thread",
] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }

pio      = "0.3"   # must match the version embassy-rp uses, or Program<N> types clash
pio-proc = "0.3"

cortex-m         = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt      = "0.7.6"
critical-section = "1.2"

defmt       = "1.1.1"
defmt-rtt   = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

static_cell     = "2.1.1"
heapless        = "0.9.3"
portable-atomic = { version = "1.15", features = ["critical-section"] }
fixed           = "1.31"

[profile.dev]
codegen-units    = 1
debug            = 2
debug-assertions = true
incremental      = false
opt-level        = 1        # 0 is too slow to service USB while driving the bus
overflow-checks  = true

[profile.release]
codegen-units    = 1
debug            = 2        # symbols cost nothing in flash, defmt wants them
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = 3
overflow-checks  = false

[profile.dev.build-override]
codegen-units = 8
debug         = false
opt-level     = 0

[profile.release.build-override]
codegen-units = 8
debug         = false
opt-level     = 0
